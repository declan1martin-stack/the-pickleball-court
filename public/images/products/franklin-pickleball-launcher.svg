<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title>Franklin Sports pickleball launcher illustration</title>
  <desc>Wheeled ball machine on a light studio background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="230" y="150" width="340" height="250" rx="28" fill="#1f2937"/>
    <circle cx="400" cy="250" r="46" fill="#f5c518"/>
    <rect x="300" y="400" width="200" height="28" rx="10" fill="#374151"/>
    <circle cx="320" cy="448" r="22" fill="#111827"/>
    <circle cx="480" cy="448" r="22" fill="#111827"/>
  </g>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#334155">Launcher</text>
</svg>

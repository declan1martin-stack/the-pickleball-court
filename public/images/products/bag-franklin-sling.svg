<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title>Franklin Sports pickleball sling bag illustration</title>
  <desc>Studio illustration of a navy and optic-yellow crossbody sling with a fence hook and a side bottle pocket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ee"/>
      <stop offset="1" stop-color="#e3ebf3"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3f66"/>
      <stop offset="0.55" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0e2438"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c430"/>
      <stop offset="1" stop-color="#d9a20f"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#111"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#123449" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="410" cy="492" rx="230" ry="26" fill="#1c4e80" opacity="0.1"/>
  <g filter="url(#shadow)">
    <path d="M250 150 C310 70 470 78 540 168" fill="none" stroke="url(#strap)" stroke-width="18" stroke-linecap="round"/>
    <path d="M248 156 C250 210 236 250 228 286" fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
    <rect x="214" y="168" width="292" height="292" rx="36" fill="url(#body)"/>
    <rect x="236" y="196" width="248" height="86" rx="16" fill="url(#panel)"/>
    <rect x="236" y="300" width="248" height="18" rx="6" fill="#0c1c2c" opacity="0.35"/>
    <path d="M250 336 H450" stroke="#d7e2ee" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <circle cx="470" cy="214" r="7" fill="#123449"/>
    <rect x="470" y="248" width="58" height="132" rx="16" fill="#24527a"/>
    <rect x="482" y="262" width="34" height="78" rx="10" fill="#8fd0ea" opacity="0.85"/>
    <path d="M506 188 C528 168 548 176 552 198" fill="none" stroke="#c5ced6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="556" cy="206" r="10" fill="none" stroke="#d5dde4" stroke-width="4"/>
  </g>
</svg>

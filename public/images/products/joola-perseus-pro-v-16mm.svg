<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title>JOOLA Perseus Pro V illustration</title>
  <desc>Red elongated paddle on a light studio background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="318" y="78" width="164" height="430" rx="82" fill="#b42318"/>
    <rect x="348" y="392" width="104" height="118" rx="18" fill="#1c1917"/>
    <rect x="372" y="418" width="56" height="70" rx="10" fill="#f8fafc" opacity="0.9"/>
  </g>
  <text x="400" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#334155">Perseus Pro V</text>
</svg>

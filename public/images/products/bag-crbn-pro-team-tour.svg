<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title>CRBN Pro Team Tour bag illustration</title>
  <desc>Studio illustration of a wide tour duffel with thermal side pockets, a vented shoe bay, fence hooks, and a zip-off sling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f5f7"/>
      <stop offset="1" stop-color="#d9e0e8"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4450"/>
      <stop offset="0.45" stop-color="#1c242d"/>
      <stop offset="1" stop-color="#10161c"/>
    </linearGradient>
    <pattern id="weave" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0 10 L10 0" stroke="#ffffff" stroke-width="0.6" opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#123449" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="390" cy="470" rx="280" ry="26" fill="#1c4e80" opacity="0.1"/>
  <g filter="url(#shadow)">
    <rect x="150" y="168" width="430" height="270" rx="36" fill="url(#shell)"/>
    <rect x="150" y="168" width="430" height="270" rx="36" fill="url(#weave)"/>
    <rect x="168" y="196" width="118" height="214" rx="18" fill="#12181f" stroke="#8aa0b4" stroke-width="2"/>
    <rect x="444" y="196" width="118" height="214" rx="18" fill="#12181f" stroke="#8aa0b4" stroke-width="2"/>
    <path d="M186 250 H268" stroke="#d5e2ee" stroke-width="2" opacity="0.6"/>
    <path d="M462 250 H544" stroke="#d5e2ee" stroke-width="2" opacity="0.6"/>
    <rect x="300" y="330" width="130" height="78" rx="12" fill="#0e141a"/>
    <g stroke="#9ec4de" stroke-width="2" opacity="0.75">
      <path d="M316 352 H414"/>
      <path d="M316 366 H414"/>
      <path d="M316 380 H414"/>
    </g>
    <path d="M168 150 C210 118 250 118 292 150" fill="none" stroke="#2a333c" stroke-width="12" stroke-linecap="round"/>
    <path d="M438 150 C480 118 520 118 562 150" fill="none" stroke="#2a333c" stroke-width="12" stroke-linecap="round"/>
    <path d="M150 250 C126 236 112 246 112 268" fill="none" stroke="#c5ced6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="110" cy="276" r="8" fill="none" stroke="#d5dde4" stroke-width="3"/>
    <path d="M580 250 C604 236 618 246 618 268" fill="none" stroke="#c5ced6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="620" cy="276" r="8" fill="none" stroke="#d5dde4" stroke-width="3"/>
    <rect x="590" y="360" width="92" height="78" rx="16" fill="#24303a" stroke="#8aa0b4"/>
    <path d="M604 388 H668" stroke="#d5e2ee" stroke-width="2"/>

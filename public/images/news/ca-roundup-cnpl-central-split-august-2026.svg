<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Canada pickleball weekly roundup hero">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a0f1c"/>
      <stop offset="1" stop-color="#a91b2e"/>
    </linearGradient>
    <linearGradient id="ballc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffc23f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgc)"/>
  <!-- court lines motif -->
  <g stroke="#c9526a" stroke-width="3" opacity="0.45" fill="none">
    <rect x="60" y="60" width="1080" height="510" rx="8"/>
    <line x1="600" y1="60" x2="600" y2="570"/>
    <line x1="60" y1="230" x2="1140" y2="230"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
  </g>
  <!-- top/bottom accents -->
  <rect x="0" y="0" width="1200" height="10" fill="#ffffff"/>
  <rect x="0" y="620" width="1200" height="10" fill="#ffffff"/>
  <!-- maple leaf (simplified, original) -->
  <g transform="translate(985,175)" fill="#ffffff" opacity="0.95">
    <path d="M0,-95 L14,-45 L52,-58 L34,-20 L74,-14 L40,10 L60,52 L14,40 L8,86 L-8,86 L-14,40 L-60,52 L-40,10 L-74,-14 L-34,-20 L-52,-58 L-14,-45 Z"/>
  </g>
  <!-- ball -->
  <g transform="translate(985,175)">
    <circle r="60" fill="url(#ballc)"/>
    <g fill="#7a0f1c">
      <circle cx="0" cy="-34" r="7"/><circle cx="30" cy="-17" r="7"/>
      <circle cx="30" cy="17" r="7"/><circle cx="0" cy="34" r="7"/>
      <circle cx="-30" cy="17" r="7"/><circle cx="-30" cy="-17" r="7"/>
      <circle cx="0" cy="0" r="7"/>
    </g>
  </g>
  <!-- eyebrow -->
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffe08a" letter-spacing="4">CANADA WEEKLY ROUNDUP</text>
  <text x="70" y="185" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f2c1c8">Aug 1 – 8, 2026</text>
  <!-- headline -->
  <text x="70" y="300" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" fill="#ffffff">CNPL Lands in London,</text>
  <text x="70" y="376" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" fill="#ffffff">A Big Canadian August</text>
  <!-- subhead chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">
    <rect x="70" y="440" width="300" height="54" rx="27" fill="#5f0b15"/>
    <text x="95" y="476" fill="#ffffff">CNPL Central Split</text>
    <rect x="390" y="440" width="300" height="54" rx="27" fill="#5f0b15"/>
    <text x="415" y="476" fill="#ffffff">PPA Vancouver 250</text>
    <rect x="710" y="440" width="270" height="54" rx="27" fill="#5f0b15"/>
    <text x="735" y="476" fill="#ffffff">Nationals: GTA</text>
  </g>
  <text x="70" y="545" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#f2c1c8">thepickleballcourt.ca</text>
</svg>

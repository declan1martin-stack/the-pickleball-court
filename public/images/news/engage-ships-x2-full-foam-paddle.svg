<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Engage X2 full-foam paddle news hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123449"/>
      <stop offset="1" stop-color="#1f5a41"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fa87a"/>
      <stop offset="0.5" stop-color="#2e7d5b"/>
      <stop offset="1" stop-color="#1c4e80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#3fa87a" stroke-width="3" opacity="0.3" fill="none">
    <rect x="60" y="60" width="1080" height="510" rx="8"/>
    <line x1="60" y1="230" x2="1140" y2="230"/>
    <line x1="60" y1="400" x2="1140" y2="400"/>
  </g>
  <rect x="0" y="0" width="1200" height="10" fill="#2e7d5b"/>
  <rect x="0" y="620" width="1200" height="10" fill="#c2410c"/>
  <!-- paddle silhouette with foam layers -->
  <g transform="translate(980,315)">
    <ellipse cx="0" cy="-40" rx="70" ry="120" fill="url(#foam)"/>
    <rect x="-14" y="70" width="28" height="110" rx="8" fill="#0f1e2b"/>
    <line x1="-50" y1="-80" x2="50" y2="-80" stroke="#8fd4b0" stroke-width="4"/>
    <line x1="-50" y1="-40" x2="50" y2="-40" stroke="#8fd4b0" stroke-width="4"/>
    <line x1="-50" y1="0" x2="50" y2="0" stroke="#8fd4b0" stroke-width="4"/>
  </g>
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#8fd4b0" letter-spacing="4">PADDLE TECH</text>
  <text x="70" y="290" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Engage Ships</text>
  <text x="70" y="368" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff">the Foam-Core X2</text>
  <text x="70" y="460" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#b8e0cc">Second-gen full-foam  Quad Density core</text>
  <text x="70" y="545" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#8fd4b0">uspickleballcourt.com</text>
</svg>

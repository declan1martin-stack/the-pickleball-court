<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="JOOLA refreshes Pro V line news hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123449"/>
      <stop offset="1" stop-color="#0f2a1f"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#2e7d5b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#2e7d5b" stroke-width="3" opacity="0.3" fill="none">
    <rect x="60" y="60" width="1080" height="510" rx="8"/>
    <line x1="60" y1="315" x2="1140" y2="315"/>
  </g>
  <rect x="0" y="0" width="1200" height="10" fill="#c2410c"/>
  <rect x="0" y="620" width="1200" height="10" fill="#2e7d5b"/>
  <!-- kinetic frame paddle -->
  <g transform="translate(980,300)">
    <ellipse cx="0" cy="-30" rx="78" ry="130" fill="none" stroke="url(#frame)" stroke-width="14"/>
    <ellipse cx="0" cy="-30" rx="52" ry="100" fill="#1c4e80"/>
    <rect x="-12" y="90" width="24" height="100" rx="6" fill="#0f1e2b"/>
    <text x="-18" y="-20" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#ffffff">V</text>
  </g>
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#f0a93b" letter-spacing="4">PRODUCT REFRESH</text>
  <text x="70" y="290" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff">JOOLA Refreshes</text>
  <text x="70" y="368" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff">the Pro V Line</text>
  <text x="70" y="460" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#b8e0cc">KineticFrame update  Ben Johns signature series</text>
  <text x="70" y="545" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#8fd4b0">uspickleballcourt.com</text>

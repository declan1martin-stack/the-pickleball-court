<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Selkirk acquires Bread and Butter news hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1f"/>
      <stop offset="1" stop-color="#1f5a41"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e7d5b"/>
      <stop offset="1" stop-color="#3fa87a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#2e7d5b" stroke-width="3" opacity="0.35" fill="none">
    <rect x="60" y="60" width="1080" height="510" rx="8"/>
    <line x1="600" y1="60" x2="600" y2="570"/>
    <line x1="60" y1="315" x2="1140" y2="315"/>
  </g>
  <rect x="0" y="0" width="1200" height="10" fill="#c2410c"/>
  <rect x="0" y="620" width="1200" height="10" fill="#2e7d5b"/>
  <!-- merged brand blocks -->
  <g transform="translate(900,170)">
    <rect x="-90" y="-40" width="160" height="100" rx="16" fill="#1c4e80"/>
    <rect x="-40" y="40" width="160" height="100" rx="16" fill="url(#accent)"/>
    <text x="-10" y="20" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff">S</text>
    <text x="40" y="100" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#ffffff">B&amp;B</text>
  </g>
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#8fd4b0" letter-spacing="4">BRAND NEWS</text>
  <text x="70" y="290" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Selkirk Acquires</text>
  <text x="70" y="368" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Bread &amp; Butter</text>
  <text x="70" y="460" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#b8e0cc">Independent design, shared distribution  May 2026</text>
  <text x="70" y="545" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#8fd4b0">uspickleballcourt.com</text>
</svg>
